$('backup').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,trainer,caught:[...caught]},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='pokedex-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('restore').onclick=()=>$('restoreFile').click();
$('restoreFile').onchange=async e=>{const file=e.target.files[0],owner=trainer;e.target.value='';if(!file)return;try{const data=JSON.parse(await file.text());if(trainer!==owner)return;if(data.version!==1||data.trainer!==trainer||!validIds(data.caught))throw Error('invalid');if(confirm('現在の図鑑にバックアップの登録データを追加しますか？')){caught=new Set([...caught,...data.caught]);persist();bag=[];start();}}catch(e){alert('同じトレーナーの有効なバックアップを選んでください。')}};
function image(el,id){const urls=imgUrls(id);let attempt=0;el.onload=()=>{if(el===$('heroImg'))$('imageStatus').textContent=attempt<2?'HOME画像を表示中 ✓':'代替アートワークを表示中 ✓'};el.onerror=()=>{attempt++;if(attempt<urls.length)el.src=urls[attempt];else if(el===$('heroImg')){$('imageStatus').textContent='画像を読み込めませんでした。もう一度お試しください。';$('retry').classList.remove('hide')}};el.src=urls[0]}
function fmt(n){return String(n).padStart(4,'0')}
function pick(){bag=bag.filter(n=>!caught.has(n));if(!bag.length){bag=Array.from({length:TOTAL},(_,i)=>i+1).filter(n=>!caught.has(n));for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}}return bag.pop()??null}
async function getInfo(id){return cache[id]}
async function getTypes(id){try{const r=await fetch(`https://pokeapi.co/api/v2/pokemon/${id}/`);if(!r.ok)return [];const d=await r.json();return d.types.sort((a,b)=>a.slot-b.slot).map(x=>typeJa[x.type.name]||x.type.name)}catch(e){return []}}
function typeHtml(t){return t.map(x=>`<span class="type" style="background:${x==='どく'?'#aa80cf':x==='ほのお'?'#ef9466':x==='みず'?'#61a8e7':x==='くさ'?'#78bc69':'#769ebc'}">${x}</span>`).join('')}
function render(){const n=caught.size;$('count').innerHTML=`${n} <span style="font-size:12px;color:#8ba9bd">/ ${TOTAL}</span>`;$('percent').textContent=(100*n/TOTAL).toFixed(1)+'%';$('quiz').classList.toggle('hide',view!=='quiz');$('dex').classList.toggle('hide',view!=='dex');$('quizTab').classList.toggle('active',view==='quiz');$('dexTab').classList.toggle('active',view==='dex');$('answerButtons').classList.toggle('hide',phase!=='question');$('next').classList.toggle('hide',!['caught','escaped'].includes(phase));$('heroImg').classList.toggle('hide',phase==='complete');$('retry').classList.toggle('hide',phase!=='error');$('types').classList.toggle('hide',!['caught','escaped'].includes(phase));if(view==='dex')renderDex();if(phase==='complete'){$('name').textContent='コンプリート！';$('message').textContent='1025しゅるい すべてを とうろくしたよ！';return}if(current){$('number').textContent='NATIONAL POKÉDEX / '+fmt(current);$('heroNo').textContent='NO. '+fmt(current)}else{$('number').textContent='NATIONAL POKÉDEX / ----';$('heroNo').textContent='NO. ----'}$('name').textContent=phase==='question'||phase==='loading'||phase==='error'?'？？？？？':(cache[current]?.name||'なまえを取得中…');$('types').innerHTML=typeHtml(cache[current]?.types||[]);const msgs={loading:'つぎの ポケモンを さがしているよ…',question:'この ポケモンの なまえは？<br>わかったら ボタンを おしてね！',caught:'ずかんに とうろくした！<br>つぎの ポケモンを さがそう！',escaped:'ポケモンに逃げられた…<br>ずかんには とうろくされなかった。',error:'データの取得を確認しているよ。<br>次のポケモンを探せるよ。'};$('message').innerHTML=msgs[phase]||''}
async function start(){const seq=++requestSeq;phase='loading';current=null;$('imageStatus').textContent='';$('heroImg').removeAttribute('src');render();const id=pick();if(!id){phase='complete';render();return}current=id;image($('heroImg'),id);phase='question';render();}
async function resolve(capture){if(phase!=='question')return;const id=current;const seq=++requestSeq;
if(capture){caught.add(id);persist();bag=bag.filter(n=>n!==id)}
phase=capture?'caught':'escaped';render();
// 図鑑登録・逃走は通信を待たずに確定。名前の取得失敗で操作を止めない。
try{const info=await getInfo(id);if(seq!==requestSeq)return;render();getTypes(id).then(types=>{if(seq!==requestSeq)return;info.types=types;render()})}catch(e){/* オフラインでもゲームを続行 */}}
function renderDex(){const q=$('search').value.trim().toLowerCase();const ids=[...caught].sort((a,b)=>a-b).filter(id=>{const name=cache[id]?.name||'';return !q||String(id).includes(q)||name.toLowerCase().includes(q)});$('dexTotal').textContent=caught.size+'種類';const shownIds=ids.slice(0,shown);$('more').classList.toggle('hide',ids.length<=shown);$('dexContents').innerHTML=ids.length?`<div class="list">${shownIds.map(id=>`<button class="entry" data-id="${id}"><img loading="lazy" data-pic="${id}" alt="ポケモン"><small>No. ${fmt(id)}</small><strong data-name="${id}">${cache[id]?.name||'読み込み中…'}</strong><small>タップして くわしくみる</small></button>`).join('')}</div>`:'<div class="empty">まだ ポケモンが とうろくされていないよ。<br>クイズで「わかった！」を おしてね！</div>';
$('dexContents').querySelectorAll('[data-pic]').forEach(el=>image(el,Number(el.dataset.pic)));$('dexContents').querySelectorAll('.entry').forEach(el=>{const id=Number(el.dataset.id);el.onclick=()=>openModal(id);if(!cache[id])getInfo(id).then(x=>{const target=$('dexContents').querySelector(`[data-name="${id}"]`);if(target)target.textContent=x.name}).catch(()=>{const target=$('dexContents').querySelector(`[data-name="${id}"]`);if(target)target.textContent='No. '+fmt(id)})})}
async function openModal(id){modalId=id;$('modalNo').textContent='NO. '+fmt(id);$('modalName').textContent=cache[id]?.name||'読み込み中…';$('modalTypes').innerHTML='';image($('modalImg'),id);$('modal').classList.remove('hide');try{const x=await getInfo(id);if(modalId!==id)return;$('modalName').textContent=x.name;if(!x.types.length)x.types=await getTypes(id);if(modalId===id)$('modalTypes').innerHTML=typeHtml(x.types)}catch(e){$('modalName').textContent='No. '+fmt(id)}}
$('know').onclick=()=>resolve(true);$('reveal').onclick=()=>resolve(false);$('next').onclick=start;$('retry').onclick=()=>start();$('quizTab').onclick=()=>{view='quiz';render()};$('dexTab').onclick=()=>{view='dex';render()};$('search').oninput=()=>{shown=24;renderDex()};$('more').onclick=()=>{shown+=24;renderDex()};$('cancel').onclick=()=>{$('modal').classList.add('hide');modalId=null};$('release').onclick=()=>{if(modalId!==null){caught.delete(modalId);persist();bag=[];if(phase==='complete')start()}$('modal').classList.add('hide');modalId=null;render()};$('modal').onclick=e=>{if(e.target===$('modal')){$('modal').classList.add('hide');modalId=null}};
try{const active=localStorage.getItem(ACTIVE);if(active)login(active)}catch(e){$('loginStatus').textContent='ブラウザの保存設定を確認してください。'}</script></body></html>
